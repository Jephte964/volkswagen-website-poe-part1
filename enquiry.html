<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta Information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>Enquiry - Volkswagen South Africa</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header Section -->
    <header>

        <!-- Website Logo -->
        <h1>Volkswagen South Africa</h1>

        <!-- Navigation Menu -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

    </header>

    <!-- Main Content -->
    <main>

        <!-- Enquiry Introduction -->
        <section>

            <h2>Vehicle Enquiry Form</h2>

            <p>
                Complete the form below to enquire about
                Volkswagen vehicles, pricing, availability,
                or additional services.
            </p>

        </section>

        <!-- Enquiry Form -->
        <section>

            <form id="enquiryForm" action="#" method="post">

                <!-- Full Name -->
                <label for="fullname">
                    Full Name:
                </label>

                <br>

                <input type="text"
                       id="fullname"
                       name="fullname"
                       placeholder="Enter your full name"
                       required>

                <br><br>

                <!-- Email Address -->
                <label for="email">
                    Email Address:
                </label>

                <br>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email address"
                       required>

                <br><br>

            <!-- Phone Number -->
<label for="phone">
    Phone Number:
</label>

<br>

<input type="tel"
       id="phone"
       name="phone"
       placeholder="Enter your phone number"
       pattern="[0-9]{10}"
       title="Please enter a 10-digit phone number"
       required>

<br><br>

            
                
          <!-- Vehicle Selection -->
<label for="vehicle">
    Select Vehicle:
</label>

<br>

<select id="vehicle"
        name="vehicle"
        required>

    <option value="">-- Select a Vehicle --</option>

    <option value="golf">Volkswagen Golf</option>
    <option value="polo">Volkswagen Polo</option>
    <option value="tiguan">Volkswagen Tiguan</option>
    <option value="amarok">Volkswagen Amarok</option>
    <option value="passat">Volkswagen Passat</option>
    <option value="tcross">Volkswagen T-Cross</option>

</select>

<br><br>
<!-- Message -->
<label for="message">
    Message:
</label>

<br>

<textarea id="message"
          name="message"
          rows="6"
          cols="40"
          placeholder="Enter your enquiry here"
          minlength="10"
          required></textarea>

<br><br>
             

            

                <!-- Submit Button -->
                <button type="submit">
                    Submit Enquiry
                </button>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>

        <p>
            © 2026 Volkswagen South Africa |
            Educational Project
        </p>

    </footer>
    <script src="js/script.js"></script>

</body>

</html>
